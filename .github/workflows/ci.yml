# The gate for the SHIPPED artifact, on every push.
#
# WHY THIS EXISTS SEPARATELY FROM Gyroscope-Dev's CI. The development repository is private, its
# Actions minutes are a metered monthly quota, and that quota is spent: its jobs are marked failed
# in ~3 seconds with runner_id: 0 and no log, because no runner is ever assigned. Public
# repositories are not metered, so this is the one place the suite can actually run. Until the dev
# repository has minutes again, a red X there is a billing state and a red X HERE is a real defect.
#
# WHY THE SUITE IS NOT UNDER `plugin/`. `plugin/` is exactly what the marketplace installs
# (Courthouse pins keel as `git-subdir` with `path: "plugin"`), so every file under it is a
# file on every user's machine. The suite lived at `plugin/tests/` and therefore shipped. It now
# sits at the repository root, outside the installed subtree, and still gates every push from
# here. The development repository keeps its copy at `plugin/tests/`; the files are byte-identical
# across both locations because they locate their roots by finding the package rather than by
# counting parent directories (see `tests/plant_support.py`).
#
# WHAT IT RUNS, AND WHY NOT MORE. The dev suite has twelve test modules; six of them are bound to
# the DEVELOPMENT layout -- they import `gyroscope.generate` / `gyroscope.provenance`, which are
# dev-only modules, or they read clauses from the archive's folder of loose per-clause files.
# This repository ships neither: it carries the compact `clauses.json` that `load_default()` is now
# the single loader for, which is why the plugin loads its 24 clauses here perfectly well while
# those six modules do not run. Shipping test files that cannot pass in the repository they sit in would be worse
# than shipping none, so only the six that gate the SHIPPED artifact are here -- plus this
# repository's own `tests/test_fence.py`, which joins the skill pages under `plugin/` to the
# clause table and byte-compares every generated view against it.

name: CI

on:
  push:
  pull_request:
  # A run that dies before any job starts -- runner loss, a queue fault, `startup_failure` --
  # cannot be retried through the API: GitHub refuses `rerun` with "this workflow run cannot be
  # retried", because there is nothing to re-run. With only push and pull_request triggers the
  # only remaining ways to get a verdict are an empty commit or closing and reopening the PR,
  # which are both ways of lying about what changed. This gives the run a door that does not
  # require inventing history. Measured: it happened on 08518b8, whose workflow file is
  # byte-identical to the green one on main.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # coqc, for tools/check_coq.py. Without it that gate is NOT-EVALUABLE, and this is the one
      # place the suite runs, so absence here would mean the proof is never graded anywhere.
      - name: Install coqc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq coq

      # The proof is applied to the table, not cited over it: proofs/Clauses.v is generated from
      # plugin/keel/clauses.json and must match it byte-for-byte; then both files compile and
      # every result is graded for axioms. A stale instance, an axiom, or a side with no class
      # is a red build.
      - name: The proof covers the table
        run: |
          python3 tools/render_coverings.py --check
          python3 tools/check_coq.py

      # The replay is this repository's own stated release evidence (see release.yml, which runs
      # it before cutting a bundle). Running it on every push means a regression is found when it
      # lands rather than at release time.
      # The sessions are generated from one spec per session, so every recorded effect is
      # explicit; a corpus edited by hand is a red build.
      - name: Corpus replay
        run: |
          python3 eval/generate_corpus.py --check
          python3 eval/replay.py

      # Stdlib unittest only, no runner installed: the suite is written for `unittest` discovery,
      # and a pytest-style module here would be a COLLECTION error that takes the whole run down
      # rather than a failing test.
      #
      # Run from the repository root, not from `plugin/`, because `tests/` is no longer inside
      # `plugin/` -- see the note above. `PYTHONPATH` is what puts the package back on the import
      # path now that the runner's cwd is no longer the directory holding it.
      - name: Plugin suite
        run: python3 -m unittest discover -s tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: plugin

      # A green fence is evidence only if the same invocation can go red. Proving that here
      # rather than trusting it: the plants run in the same job as the fence, so a future edit
      # that quietly makes a planted check vacuous fails the build instead of reporting coverage
      # it lost. Restore is by copy, never by byte arithmetic, and verified by sha.
      - name: The fence must be able to fail
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: plugin
          D: plugin
          # `hooks/hooks.json` joined this set because three dead pointers lived in it through a
          # whole rename -- a directory, a module and a digest of the two, none of which existed --
          # and nothing read any of them, which is exactly why nothing noticed.
          PAGES: SKILL.md POINTS.md ACTS.md vocabulary.json keel/clauses.json keel/clauses.py keel/compaction.json hooks/hooks.json
        run: |
          set -eu
          BAK=$(mktemp -d)
          ( cd "$D" && cp --parents $PAGES "$BAK" )
          restore() { local q; for q in $PAGES; do cp "$BAK/$q" "$D/$q"; done; }
          trap restore EXIT

          suite() { python3 -m unittest discover -s tests; }

          plant() {
            name="$1"; shift
            restore
            before=$(cd "$D" && sha256sum $PAGES)
            eval "$@"
            if [ "$(cd "$D" && sha256sum $PAGES)" = "$before" ]; then
              echo "::error::PLANT NEVER REACHED THE FILE -- '$name' changed nothing" >&2
              exit 1
            fi
            if suite >/dev/null 2>&1; then
              echo "::error::VACUOUS CHECK -- planted fault '$name' left the suite green" >&2
              exit 1
            fi
            restore
            if [ "$(cd "$D" && sha256sum $PAGES)" != "$before" ]; then
              echo "::error::RESTORE NOT BYTE-EXACT after '$name'" >&2
              exit 1
            fi
            echo "  $name -> red, and restored byte-exact"
          }

          plant "act renamed"                 "sed -i 's/^## push\$/## force_push/' $D/ACTS.md"
          plant "acts cite an orphan point"   "printf '\nPoint \`U99\` covers none of this.\n' >> $D/ACTS.md"
          plant "definition mutated"          "sed -i 's/the unhealing issue/the unhealed issue/' $D/SKILL.md"
          plant "shapes row renamed"          "sed -i 's/^| \*\*repeated\*\* |/| **recurring** |/' $D/SKILL.md && printf '\nA distractor so a substring scan still finds the word repeated outside the renamed row.\n' >> $D/SKILL.md"
          plant "point entry renamed"         "sed -i 's/^## U25\$/## U26/' $D/POINTS.md"
          plant "point dropped from contents" "sed -i 's|\[U19\](#u19) in-place rewrite|in-place rewrite|' $D/POINTS.md"
          plant "clause row dropped"          "jq 'del(.[0])' $D/keel/clauses.json > /tmp/cl.json && mv /tmp/cl.json $D/keel/clauses.json"
          plant "construction anchor broken"  "jq 'map(if .id == \"A02\" then .construction = \"POINTS.md#zzz\" else . end)' $D/keel/clauses.json > /tmp/cl.json && mv /tmp/cl.json $D/keel/clauses.json"
          plant "row loses its construction" "jq 'map(if .id == \"P01\" then del(.construction) else . end)' $D/keel/clauses.json > /tmp/cl.json && mv /tmp/cl.json $D/keel/clauses.json"
          plant "a point nothing anchors to"  "printf '\n## U98\nAn entry no clause row claims.\n' >> $D/POINTS.md"
          plant "shared anchor goes stale"    "jq 'map(if .id == \"P02\" then .construction = \"POINTS.md#p02\" else . end)' $D/keel/clauses.json > /tmp/cl.json && mv /tmp/cl.json $D/keel/clauses.json"
          plant "generated view hand-edited"  "sed -i 's/^| \`A01\` |/| \`A00\` |/' $D/SKILL.md"
          plant "normative force in SKILL"    "printf '\nA reader MUST follow this.\n' >> $D/SKILL.md"
          plant "normative force in POINTS"   "printf '\nThe guard SHALL be run.\n' >> $D/POINTS.md"
          plant "normative force in ACTS"     "printf '\nThis step is REQUIRED.\n' >> $D/ACTS.md"
          plant "reference points at nothing" "sed -i 's|(POINTS.md)|(MISSING.md)|' $D/SKILL.md"
          plant "vendored list unsupplied"    "sed -i 's/\"supplies\": \"shapes\"/\"supplies\": \"shpaes\"/' $D/vocabulary.json"
          plant "frontmatter loses its trigger" "sed -i 's/^description:/described:/' $D/SKILL.md"
          plant "body overruns its budget"    "seq -f 'padding line %g of the budget plant' 500 >> $D/SKILL.md"
          plant "construction block mistagged" "sed -i '0,/\`\`\`sh/s//\`\`\`python/' $D/POINTS.md"

          # RE-AIMED A SECOND TIME, and again its own assert demanded it. This plant has
          # followed "where is the command decided" through two migrations: first a separator
          # alternation inside clauses.json, then `_scan`'s separator class in clauses.py once
          # the textual coverings were retired. #33 retired the segmenter itself: no guard and
          # no occasion reads the command string any more, so there is no separator class to
          # narrow and the plant reported "plant seam changed" on main, exactly as built.
          #
          # The rule that decides now is the loader law: a guard is a host tool call or an
          # observed effect, never a spelling, refused as CLAUSE-GUARD-NOMINAL. So the plant
          # disarms THAT line. With the refusal gone, `tests/test_derived_closure` plants a
          # nominal guard and expects the refusal; the suite must go red. Witnessed before being
          # trusted: planted, `unittest discover -s tests` exits 1 against a clean baseline.
          # `keel/clauses.py` stays in PAGES: backed up, digested, restored byte-exact.
          cat > /tmp/disarm-guard-law.py <<'PLANT'
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          old = '        if name == "discharged_by" and classify_side(predicate) not in AGNOSTIC_CLASSES:'
          new = '        if False:'
          assert text.count(old) == 1, (
              "plant seam changed: the guard law is no longer spelled this way, so this plant "
              "tests nothing -- re-aim it at the line that refuses a nominal guard, or retire it "
              "with its reason")
          path.write_text(text.replace(old, new))
          PLANT
          sed -i 's/^          //' /tmp/disarm-guard-law.py

          plant "the guard law stops refusing a nominal guard" "python3 /tmp/disarm-guard-law.py $D/keel/clauses.py"
          plant "a hook file names the old package" "jq '. + {_provenance: {recompute_with: \"python3 -m gyroscope.generate\"}}' $D/hooks/hooks.json > /tmp/hj.json && mv /tmp/hj.json $D/hooks/hooks.json"
          # No `${CLAUDE_PLUGIN_ROOT}` in the planted value: under `set -u` the eval would expand
          # it and abort on an unbound variable before reaching the file. A bare relative path
          # exercises the same assertion -- the file the command names is not there.
          plant "the preserve list drifts from its digest" "jq '.preserve = \"cut whatever you like\"' $D/keel/compaction.json > /tmp/cj.json && mv /tmp/cj.json $D/keel/compaction.json"
          plant "a hook command points at nothing" "jq '.hooks.Stop[0].hooks[0].command = \"hooks/gone.sh\"' $D/hooks/hooks.json > /tmp/hj.json && mv /tmp/hj.json $D/hooks/hooks.json"

          restore
          suite
          echo "restored, and green again"

      # The images are a generated view too, and the only one whose source is not under $PAGES:
      # `docs/img/*.svg` renders to the PNGs the README shows. Same discipline, its own step
      # because the files it plants live outside the page set restored above.
      - name: A stale rendering must be loud
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: plugin
          IMAGES: docs/img
        run: |
          set -eu
          BAK=$(mktemp -d)
          cp -r "$IMAGES"/. "$BAK"
          restore() { cp -r "$BAK"/. "$IMAGES"; }
          trap restore EXIT
          only() { python3 -m unittest tests.test_fence.RenderedImagesTrackTheirSource; }

          sed -i 's/viewBox="0 0 1200 210"/viewBox="0 0 1200 260"/' "$IMAGES/keel-hero.svg"
          if only >/dev/null 2>&1; then
            echo "::error::VACUOUS -- a resized source left its stale rendering green" >&2
            exit 1
          fi
          restore
          echo "  source resized, rendering stale -> red"

          rm "$IMAGES/ledger-flow-dark.png"
          if only >/dev/null 2>&1; then
            echo "::error::VACUOUS -- a missing rendering left the check green" >&2
            exit 1
          fi
          restore
          echo "  rendering absent -> red"

          only >/dev/null
          echo "restored, and green again"

      # Absence is a failure, never a skip: with an input gone the fence has nothing to check,
      # and reporting that as a pass is the exact shape this repository exists to refuse.
      - name: A missing input must be loud
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: plugin
          D: plugin
          # The two hook files joined the list once the fence started resolving what they name:
          # a shim that is gone, and a hooks map that is gone, are both absences the suite can
          # now see -- and an absence it can see is an absence it has to go red on.
          PAGES: SKILL.md POINTS.md ACTS.md vocabulary.json keel/clauses.json keel/compaction.json hooks/hooks.json hooks/dispatch.sh
        run: |
          set -eu
          # If anything kills this step between the mv out and the mv back, put the file back --
          # otherwise the tree is left mutated and every later step reads a lie.
          trap '[ -f /tmp/absent.tmp ] && mv /tmp/absent.tmp "$D/$target"' EXIT
          for target in $PAGES; do
            mv "$D/$target" /tmp/absent.tmp
            if [ -f "$D/$target" ]; then
              echo "::error::$target still present -- the move never happened" >&2
              exit 1
            fi
            if python3 -m unittest discover -s tests >/dev/null 2>&1; then
              mv /tmp/absent.tmp "$D/$target"
              echo "::error::GREEN ON MISSING -- the fence passed with $target absent" >&2
              exit 1
            fi
            mv /tmp/absent.tmp "$D/$target"
            echo "  absent $target -> red, as it has to be"
          done
