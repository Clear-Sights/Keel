name: Manual Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The version is READ, never typed. A hand-entered release input is exactly what cut
      # `v1.1.0` against a manifest still declaring `0.1.0`: the tag and the number a user
      # actually installs came from two places and nothing compared them. One source, one value,
      # and the disagreement becomes unrepresentable rather than merely discouraged.
      - name: Derive the version from the plugin manifest
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('plugin/.claude-plugin/plugin.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "releasing v$VERSION"

      - name: Run the replay evidence
        run: python3 eval/replay.py

      - name: Build the install bundle (no eval, no tooling)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          STAGE="keel-$VERSION"
          mkdir "$STAGE"
          cp -r plugin LICENSE README.md "$STAGE"/
          zip -qr "keel-$VERSION.zip" "$STAGE"
          # Both exclusions asserted, not assumed: a bundle that quietly regained either of them
          # would look exactly like a correct one. The tests assertion no longer has a matching
          # `rm` above it, and that is the point -- the suite is outside `plugin/` now, so this
          # copy cannot pick it up. Keeping the assertion is what would catch it moving back.
          unzip -l "keel-$VERSION.zip" | grep -q "eval/" && exit 1 || true
          unzip -l "keel-$VERSION.zip" | grep -q "plugin/tests/" && exit 1 || true

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "keel $VERSION"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "Obligation-ledger hook for Claude Code and Codex: a costly call is denied until its cheap guard is on record, then the same call executes — and one skill whose pages carry each clause's positive construction. Verified at release time: the 5/5 corpus replay (\`python3 eval/replay.py\`). Install from \`keel-$VERSION.zip\` — it carries \`plugin/\` only (dispatcher, clause table, hooks, and the skill pages in one arm); the eval corpus lives in the repository, not the release bundle." \
            "keel-$VERSION.zip"
